name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build FixedIncome.slnx --configuration Release
      - name: Test (offline, committed market-data fixtures)
        env:
          FIXEDINCOME_OFFLINE: "1"
        run: dotnet test FixedIncome.slnx --configuration Release --no-build
